<script>

// 📦 BANCO FAKE
let usuarios =
JSON.parse(localStorage.getItem("usuarios"))
|| [];

// ❤️ FAVORITAS
let favoritas =
JSON.parse(localStorage.getItem("favoritas"))
|| [];

// 🔥 EM ALTA
const emAlta = [
    "Tim Maia - Vale Tudo",
    "Chico Buarque - Construção",
    "Caetano Veloso - Você é Linda"
];

// 💾 SALVAR
function salvar(){

    localStorage.setItem(
        "usuarios",
        JSON.stringify(usuarios)
    );
}

// 📩 EMAIL
function emailValido(email){

    return email.includes("@")
    && email.includes(".");
}

// 🔐 CADASTRAR
function cadastrar(){

    const email =
    prompt("Digite seu email:");

    const senha =
    prompt("Crie uma senha:");

    if(!email || !senha){

        return alert(
            "⚠️ Preencha tudo!"
        );
    }

    if(!emailValido(email)){

        return alert(
            "❌ Email inválido!"
        );
    }

    if(senha.length < 6){

        return alert(
            "❌ Senha fraca!"
        );
    }

    const existe =
    usuarios.find(
        u => u.email === email
    );

    if(existe){

        return alert(
            "⚠️ Usuário já existe!"
        );
    }

    usuarios.push({
        email,
        senha
    });

    salvar();

    alert(
        "✅ Conta criada!"
    );
}

// 🔑 LOGIN
function login(){

    const email =
    document.getElementById(
        "email"
    ).value.trim();

    const senha =
    document.getElementById(
        "senha"
    ).value.trim();

    const user =
    usuarios.find(
        u =>
        u.email === email &&
        u.senha === senha
    );

    if(user){

        localStorage.setItem(
            "logado",
            email
        );

        document.getElementById(
            "loginPage"
        ).style.display = "none";

        document.getElementById(
            "homePage"
        ).style.display = "block";

        document.getElementById(
            "usuarioNome"
        ).innerText =
        "👤 " + email;

    }else{

        alert(
            "❌ Login inválido!"
        );
    }
}

// 🚪 LOGOUT
function logout(){

    localStorage.removeItem(
        "logado"
    );

    document.getElementById(
        "loginPage"
    ).style.display = "block";

    document.getElementById(
        "homePage"
    ).style.display = "none";
}

// 🎵 PLAYER
function tocar(musica,nome){

    const player =
    document.getElementById(
        "player"
    );

    player.src = musica;

    player.play();

    document.getElementById(
        "musica"
    ).innerText =
    "🎶 Tocando: " + nome;
}

function pausar(){

    document.getElementById(
        "player"
    ).pause();
}

// ❤️ FAVORITAR
function favoritar(nome){

    if(favoritas.includes(nome)){

        return alert(
            "❤️ Música já favoritada!"
        );
    }

    favoritas.push(nome);

    localStorage.setItem(
        "favoritas",
        JSON.stringify(favoritas)
    );

    alert(
        "💖 Música adicionada!"
    );
}

// 🔥 EM ALTA
function abrirEmAlta(){

    const area =
    document.getElementById(
        "conteudo"
    );

    area.innerHTML = `

    <h1 style="margin-bottom:20px;">
        🔥 Em Alta
    </h1>

    <div class="music-grid">

        ${emAlta.map(musica => `

        <div class="card">

            <img src="https://picsum.photos/200?random=${Math.random()}">

            <h3>${musica}</h3>

            <button onclick="
                tocar(
                    '${musica}.mp3',
                    '${musica}'
                )
            ">
                ▶️ Tocar
            </button>

            <button onclick="
                favoritar('${musica}')
            ">
                💖 Favoritar
            </button>

        </div>

        `).join("")}

    </div>
    `;
}

// ❤️ FAVORITAS
function abrirFavoritas(){

    const area =
    document.getElementById(
        "conteudo"
    );

    if(favoritas.length === 0){

        area.innerHTML = `
        
        <h1>❤️ Favoritas</h1>

        <p style="
            margin-top:20px;
            font-size:20px;
        ">
            Nenhuma música favoritada.
        </p>
        `;

        return;
    }

    area.innerHTML = `

    <h1 style="margin-bottom:20px;">
        ❤️ Favoritas
    </h1>

    <div class="music-grid">

        ${favoritas.map(musica => `

        <div class="card">

            <img src="https://picsum.photos/200?random=${Math.random()}">

            <h3>${musica}</h3>

            <button onclick="
                tocar(
                    '${musica}.mp3',
                    '${musica}'
                )
            ">
                ▶️ Tocar
            </button>

        </div>

        `).join("")}

    </div>
    `;
}

// 🏠 INÍCIO
function abrirInicio(){

    location.reload();
}

// 🔥 LOGIN SALVO
window.onload = () => {

    const logado =
    localStorage.getItem(
        "logado"
    );

    if(logado){

        document.getElementById(
            "loginPage"
        ).style.display = "none";

        document.getElementById(
            "homePage"
        ).style.display = "block";

        document.getElementById(
            "usuarioNome"
        ).innerText =
        "👤 " + logado;
    }
}

</script>

<script src="backend.js"></script>
