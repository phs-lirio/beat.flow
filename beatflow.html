<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <title>Beat Flow</title>

    <style>
        /* =========================
   RESET
========================= */
    </style>
</head>

<body>

    <!-- LOGIN -->
    <div id="loginPage">

        <div class="login-box">

            <h1 class="logo-login">
                <img src="logo.jpeg" alt="Logo">
                BeatFlow
            </h1>

            <input type="email" id="email" placeholder="Digite seu email">

            <input type="password" id="senha" placeholder="Digite sua senha">

            <button onclick="login()">
                Entrar
            </button>

            <button onclick="cadastrar()">
                Criar Conta
            </button>

            <div class="link" onclick="esqueciSenha()">

                🔑 Esqueci minha senha

            </div>

            <div class="link" onclick="atualizarSenha()">

                🔄 Atualizar senha

            </div>

        </div>

    </div>

    <!-- HOME -->

    <div id="homePage">

        <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">

            <div class="container-fluid">

                <a class="navbar-brand logo-navbar" href="#">

                    <img src="logo.jpeg" alt="Logo" class="logo-nav-img">

                    BeatFlow

                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarBeat">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarBeat">

                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                        <li class="nav-item">
                            <a class="nav-link active" href="#" onclick="abrirInicio()">
                                🏠 Início
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#" onclick="abrirEmAlta()">
                                🔥 Em Alta
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#" onclick="abrirFavoritas()">
                                ❤️ Favoritas
                            </a>
                        </li>
                        <li class="nav-item ms-4">
                            <input type="text" class="pesquisa-navbar" placeholder="🔍 Pesquisar música..."
                                onkeydown="buscarEnter(event)">

                        </li>

                    </ul>

                    <button class="btn btn-danger" onclick="logout()">
                        🚪 Sair
                    </button>

                </div>

            </div>

        </nav>
        <div class="app">


            <!-- CONTEÚDO -->
            <div class="content" id="conteudo">

                <div class="topbar">

                    <h1 class="titulo-beatflow">
                        Home
                    </h1>

                    <div class="user" id="usuarioNome">
                    </div>

                </div>

                <div class="music-grid">

                    <div class="beat-card">

                        <img src="imagens/quero-dinheiro.jpg" alt="Tim Maia - Não Quero Dinheiro">

                        <h3>
                            Tim Maia - Não Quero Dinheiro
                        </h3>

                        <button onclick="
                        tocar(
                            'musica1.mp3',
                            'Tim Maia - Não Quero Dinheiro'
                        )
                    ">
                            ▶️ Tocar
                        </button>

                        <button onclick="
                        favoritar(
                            'Tim Maia - Não Quero Dinheiro'
                        )
                    ">
                            💖 Favoritar
                        </button>

                    </div>

                    <div class="beat-card">


                        <img src="imagens/vale-tudo.jpg" alt="Tim Maia - Vale Tudo">

                        <h3>
                            Tim Maia - Vale Tudo
                        </h3>

                        <button onclick="
                        tocar(
                            'musica2.mp3',
                            'Tim Maia - Vale Tudo'
                        )
                    ">
                            ▶️ Tocar
                        </button>

                        <button onclick="
                        favoritar(
                            'Tim Maia - Vale Tudo'
                        )
                    ">
                            💖 Favoritar
                        </button>

                    </div>

                </div>

            </div>

        </div>

        <!-- PLAYER -->
        <div class="player">

            <!-- INFO DA MÚSICA -->
            <div class="player-left">
                <img id="capaAtual" src="logo.jpeg" alt="capa">

                <div class="player-text">
                    <div id="musica">Nenhuma música tocando</div>
                </div>

                <button onclick="favoritarAtual()">❤️</button>
            </div>

            <!-- CONTROLES CENTRAIS -->
            <div class="player-center">

                <div class="controls">

                    <button onclick="voltarMusica()">⏮️</button>

                    <button class="play-btn" onclick="togglePlay()">▶️</button>

                    <button onclick="proximaMusica()">⏭️</button>

                </div>

                <input type="range" id="progress" value="0">

            </div>

            <!-- LADO DIREITO -->
            <div class="player-right">

                🔊 <input type="range" id="volume" min="0" max="1" step="0.1">

            </div>

            <audio id="player"></audio>

        </div>

    </div>

    </div>

    <script>

        // 📦 BANCO FAKE
        let usuarios =
            JSON.parse(localStorage.getItem("usuarios"))
            || [];

        // ❤️ FAVORITAS
        let favoritas = JSON.parse(localStorage.getItem("favoritas")) || [];

        // 🔥 EM ALTA
        const musicas = [
            {
                nome: "Tim Maia - Não Quero Dinheiro",
                imagem: "imagens/quero-dinheiro.jpg",
                audio: "musica1.mp3"
            },
            {
                nome: "Tim Maia - Vale Tudo",
                imagem: "imagens/vale-tudo.jpg",
                audio: "musica2.mp3"
            },
            {
                nome: "Chico Buarque - Construção",
                imagem: "imagens/chico-buarque.jpg",
                audio: "construcao.mp3"
            },
            {
                nome: "Caetano Veloso - Você é Linda",
                imagem: "imagens/caetano-veloso.jpg",
                audio: "voce-e-linda.mp3"
            }
        ];

        // 💾 SALVAR
        function salvar() {

            localStorage.setItem(
                "usuarios",
                JSON.stringify(usuarios)
            );
        }

        // 📩 EMAIL
        function emailValido(email) {

            return email.includes("@")
                && email.includes(".");
        }

        // 🔐 CADASTRAR
        function cadastrar() {

            const email =
                prompt("Digite seu email:");

            const senha =
                prompt("Crie uma senha:");

            if (!email || !senha) {

                return alert(
                    "⚠️ Preencha tudo!"
                );
            }

            if (!emailValido(email)) {

                return alert(
                    "❌ Email inválido!"
                );
            }

            if (senha.length < 6) {

                return alert(
                    "❌ Senha fraca!"
                );
            }

            const existe =
                usuarios.find(
                    u => u.email === email
                );

            if (existe) {

                return alert(
                    "⚠️ Usuário já existe!"
                );
            }

            usuarios.push({
                email,
                senha
            });

            salvar();

            alert(
                "✅ Conta criada!"
            );
        }

        // 🔑 LOGIN
        function login() {

            const email =
                document.getElementById(
                    "email"
                ).value.trim();

            const senha =
                document.getElementById(
                    "senha"
                ).value.trim();

            const user =
                usuarios.find(
                    u =>
                        u.email === email &&
                        u.senha === senha
                );

            if (user) {

                localStorage.setItem(
                    "logado",
                    email
                );

                document.getElementById(
                    "loginPage"
                ).style.display = "none";

                document.getElementById(
                    "homePage"
                ).style.display = "block";

                document.getElementById(
                    "usuarioNome"
                ).innerText =
                    "👤 " + email;

            } else {

                alert(
                    "❌ Login inválido!"
                );
            }
        }

        // 🚪 LOGOUT
        function logout() {

            localStorage.removeItem(
                "logado"
            );

            document.getElementById(
                "loginPage"
            ).style.display = "block";

            document.getElementById(
                "homePage"
            ).style.display = "none";
        }

        // 🎵 PLAYER
        let musicaAtualIndex = 0;
        let tocando = false;

        function tocar(musica, nome, capa) {
            const player = document.getElementById("player");

            player.src = musica;
            player.play();

            document.getElementById("musica").innerText = nome;
            document.getElementById("capaAtual").src = capa;

            tocando = true;
        }

        function togglePlay() {
            const player = document.getElementById("player");

            if (player.paused) {
                player.play();
                tocando = true;
            } else {
                player.pause();
                tocando = false;
            }
        }

        function proximaMusica() {
            musicaAtualIndex++;

            if (musicaAtualIndex >= musicas.length) {
                musicaAtualIndex = 0;
            }

            const m = musicas[musicaAtualIndex];
            tocar(m.audio, m.nome, m.imagem);
        }
        function voltarMusica() {
            musicaAtualIndex--;

            if (musicaAtualIndex < 0) {
                musicaAtualIndex = musicas.length - 1;
            }

            const m = musicas[musicaAtualIndex];
            tocar(m.audio, m.nome, m.imagem);
        }
        document.addEventListener("DOMContentLoaded", () => {
            const player = document.getElementById("player");
            const volume = document.getElementById("volume");

            volume.addEventListener("input", () => {
                player.volume = volume.value;
            });
        });

        // ❤️ FAVORITAR
        function favoritar(nome) {

            const musica = musicas.find(
                m => m.nome === nome
            );

            if (!musica) return;

            const existe = favoritas.find(
                f => f.nome === nome
            );

            if (existe) {
                return alert("❤️ Música já favoritada!");
            }

            favoritas.push({
                nome: musica.nome,
                imagem: musica.imagem,
                audio: musica.audio
            });

            localStorage.setItem(
                "favoritas",
                JSON.stringify(favoritas)
            );

            alert("💖 Música adicionada!");
        }

        // 🔥 EM ALTA
        function abrirEmAlta() {

            const area = document.getElementById("conteudo");

            area.innerHTML = `
        <h1 class="titulo-beatflow">🔥 Em Alta</h1>

        <div class="music-grid">

            ${musicas.map(musica => `
                <div class="beat-card">

                    <img src="${musica.imagem}">

                    <h3>${musica.nome}</h3>

                    <button onclick="
                        tocar(
                            '${musica.audio}',
                            '${musica.nome}'
                        )
                    ">
                        ▶️ Tocar
                    </button>

                    <button onclick="
                        favoritar('${musica.nome}')
                    ">
                        💖 Favoritar
                    </button>

                </div>
            `).join("")}

        </div>
    `;
        }

        // ❤️ FAVORITAS
        function abrirFavoritas() {

            const area = document.getElementById("conteudo");

            if (favoritas.length === 0) {

                area.innerHTML = `
        <h1 class="titulo-beatflow">❤️ Favoritas</h1>

        <p style="
            margin-top:20px;
            font-size:20px;
        ">
            Nenhuma música favoritada.
        </p>
    `;

                return;
            }

            area.innerHTML = `
    <h1 class="titulo-beatflow">❤️ Favoritas</h1>

    <div class="music-grid">

        ${favoritas.map(musica => `
            <div class="beat-card">

                <img src="${musica.imagem}">

                <h3>${musica.nome}</h3>

                <button onclick="
                    tocar(
                        '${musica.audio}',
                        '${musica.nome}'
                    )
                ">
                    ▶️ Tocar
                </button>

            </div>
        `).join("")}

    </div>
`;
        }

        // 🏠 INÍCIO
        function abrirInicio() {

            location.reload();
        }

        // 🔥 LOGIN SALVO
        window.onload = () => {

            const logado =
                localStorage.getItem(
                    "logado"
                );

            if (logado) {

                document.getElementById(
                    "loginPage"
                ).style.display = "none";

                document.getElementById(
                    "homePage"
                ).style.display = "block";

                document.getElementById(
                    "usuarioNome"
                ).innerText =
                    "👤 " + logado;
            }
        }

        window.abrirFavoritas = abrirFavoritas;
        window.abrirEmAlta = abrirEmAlta;
        window.favoritar = favoritar;
        window.tocar = tocar;
        window.login = login;
        window.logout = logout;
    </script>

    <script src="backend.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
